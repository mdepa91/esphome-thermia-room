<text x="110" y="245" font-size="12" fill="#3c4043">raw 1 = short gap before the pulse, raw 0 = long gap (see timing diagram); logical bit = NOT raw bit</text>
<text x="110" y="263" font-size="12" fill="#3c4043">multi-bit fields are LSB first; setpoint is in 0.5 °C steps (value = setpoint × 2)</text>
<text x="110" y="281" font-size="12" fill="#3c4043">checksum = (integer XOR tenths XOR setpoint×2) AND 31   →   (22 ^ 4 ^ 43) &amp; 31 = 25</text>
